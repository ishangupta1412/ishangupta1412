name: Sync 3D PUBG Battle Arena

on:
  schedule:
    - cron: '30 0 * * *' # Daily at 00:30 UTC (right after arena render)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repo
        uses: actions/checkout@v4

      - name: Download Latest Rendered Battle Arena WebP
        run: |
          mkdir -p assets
          curl -sSL "https://raw.githubusercontent.com/ishangupta1412/pubg-contrib-arena/main/output/contrib-battle.webp" -o assets/contrib-battle.webp

      - name: Commit & Push if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-battle.webp
          git diff --staged --quiet || git commit -m "chore(arena): auto-sync latest 3D PUBG contribution battle animation"
          git push
