name: Generate Galaga Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC — auto-updates with new contributions
  workflow_dispatch:        # Manual trigger from Actions tab
  push:
    branches:
      - main                # Also runs on every push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Galaga contribution graph SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
