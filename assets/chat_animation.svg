<svg width="650" height="380" viewBox="0 0 650 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ishan Gupta - Introduction">
  <style>
    .font-ui {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: -0.01em;
    }
    .bubble-bg {
      fill: #e9e9eb;
      transition: fill 0.3s;
    }
    .bubble-text {
      fill: #1c1c1e;
      font-weight: 450;
    }

    @media (prefers-color-scheme: dark) {
      .bubble-bg {
        fill: #2c2c2e;
      }
      .bubble-text {
        fill: #f2f2f7;
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .bubble-1 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .bubble-2 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .bubble-3 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }

    .bubble-4 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
    }

    .bubble-5 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
    }

    .bubble-6 {
      opacity: 0;
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }
  </style>

  <!-- Message Bubbles Stack -->
  <g>

    <!-- Message 1 -->
    <g class="bubble-1">
      <rect x="20" y="15" width="220" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="42" class="bubble-text font-ui" font-size="15.5">Hey there! I'm Ishan 👋</text>
    </g>

    <!-- Message 2 -->
    <g class="bubble-2">
      <rect x="20" y="72" width="485" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="99" class="bubble-text font-ui" font-size="14.5">First-year engineering student passionate about math &amp; computing 📐⚡</text>
    </g>

    <!-- Message 3 -->
    <g class="bubble-3">
      <rect x="20" y="129" width="505" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="156" class="bubble-text font-ui" font-size="14">I love building clean software, diving into algorithms &amp; experimenting with AI 💻🚀</text>
    </g>

    <!-- Message 4 -->
    <g class="bubble-4">
      <rect x="20" y="186" width="460" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="213" class="bubble-text font-ui" font-size="14.5">Always curious, learning continuously and solving hard problems 💡✨</text>
    </g>

    <!-- Message 5 -->
    <g class="bubble-5">
      <rect x="20" y="243" width="405" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="270" class="bubble-text font-ui" font-size="14.5">You can connect with me on LinkedIn, Gmail, and X 👇</text>
    </g>

    <!-- Message 6 -->
    <g class="bubble-6">
      <rect x="20" y="300" width="225" height="44" rx="18" class="bubble-bg" />
      <text x="36" y="327" class="bubble-text font-ui" font-size="15.5">Have a great day ahead! ✌️</text>
    </g>
  </g>
</svg>