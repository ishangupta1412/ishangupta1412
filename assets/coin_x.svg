<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56">
  <defs>
    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="25%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FFF8E1" />
      <stop offset="75%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Obsidian Enamel Face -->
    <radialGradient id="xFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Specular Sheen Beam -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0. />
    </linearGradient>

    <filter id="coinDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="embossLogo">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <clipPath id="coinClip">
      <circle cx="32" cy="32" r="26" />
    </clipPath>
  </defs>

  <style>
    @keyframes sheenPass {
      0% { transform: translateX(-64px) translateY(-64px); }
      30%, 100% { transform: translateX(64px) translateY(64px); }
    }
    .coin-sheen {
      animation: sheenPass 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 2.4s;
    }
  </style>

  <!-- 3D Shadow -->
  <circle cx="32" cy="34" r="28" fill="#000000" opacity="0.4" />

  <!-- Outer Milled Rim -->
  <circle cx="32" cy="32" r="28" fill="url(#goldRim)" filter="url(#coinDepth)" />

  <!-- Inner Ridge Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#FFE082" stroke-width="0.8" stroke-opacity="0.8" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#FF8F00" stroke-width="0.8" stroke-opacity="0.9" />

  <!-- Recessed Coin Face -->
  <circle cx="32" cy="32" r="25" fill="url(#xFace)" />

  <!-- Embossed Official X Logo -->
  <g filter="url(#embossLogo)" fill="#FFFFFF" transform="translate(22, 22)">
    <path d="M 15.7 0 L 19.3 0 L 11.4 9.0 L 20.7 21 L 13.4 21 L 7.7 13.6 L 1.2 21 L -2.4 21 L 5.9 11.4 L -2.9 0 L 4.5 0 L 9.7 6.8 L 15.7 0 Z M 14.4 18.9 L 16.4 18.9 L 4.0 2.0 L 1.9 2.0 L 14.4 18.9 Z" />
  </g>

  <!-- Specular Sheen Animation Layer -->
  <g clip-path="url(#coinClip)">
    <rect class="coin-sheen" x="-32" y="-32" width="128" height="128" fill="url(#sheen)" />
  </g>

  <!-- Subtle Top Rim Light -->
  <path d="M 12 18 A 25 25 0 0 1 52 18" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.5" />
</svg>
