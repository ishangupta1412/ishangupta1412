<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56">
  <defs>
    <!-- Heavy Gunmetal / Matte Slate Beveled Rim -->
    <linearGradient id="tacticalRim_gmail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Combat Face Radial (Deep Enamel) -->
    <radialGradient id="combatFace_gmail" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="65%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#080C14" />
    </radialGradient>

    <!-- Crisp Pure White Specular Sheen Reflection (Zero Blue Slop) -->
    <linearGradient id="sheen_gmail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="depth_gmail" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <clipPath id="faceClip_gmail">
      <circle cx="32" cy="32" r="23" />
    </clipPath>
  </defs>

  <style>
    @keyframes sheenSweep_gmail {
      0% { transform: translateX(-64px) translateY(-64px); }
      30%, 100% { transform: translateX(64px) translateY(64px); }
    }
    .coin-sheen_gmail {
      animation: sheenSweep_gmail 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      animation-delay: 1s;
    }
  </style>

  <!-- Ground Drop Shadow -->
  <circle cx="32" cy="34.5" r="27" fill="#000000" opacity="0.6" />

  <!-- Outer Gunmetal Bezel Rim -->
  <circle cx="32" cy="32" r="27" fill="url(#tacticalRim_gmail)" filter="url(#depth_gmail)" />

  <!-- Precision Machined Inner Borders -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#0B0F19" stroke-width="1.2" />
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- 4 Tactical Rivet Corner Bolts -->
  <circle cx="32" cy="6.5" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="57.5" cy="32" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="32" cy="57.5" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="6.5" cy="32" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />

  <!-- Recessed Combat Face -->
  <circle cx="32" cy="32" r="23" fill="url(#combatFace_gmail)" />

  <!-- Embossed Official Brand Logo -->
  <g fill="#FFFFFF" opacity="0.95">
    <g transform="translate(19.5, 22)">
  <path d="M 2 3 C 0.9 3 0 3.9 0 5 L 0 20 C 0 21.1 0.9 22 2 22 L 23 22 C 24.1 22 25 21.1 25 20 L 25 5 C 25 3.9 24.1 3 23 3 L 2 3 Z M 12.5 13.8 L 3.5 6 L 21.5 6 L 12.5 13.8 Z M 2 7.5 L 8 13 L 2 18.5 L 2 7.5 Z M 23 7.5 L 23 18.5 L 17 13 L 23 7.5 Z M 9.5 14.2 L 12.5 16.5 L 15.5 14.2 L 21.2 20 L 3.8 20 L 9.5 14.2 Z" />
</g>
  </g>

  <!-- Animated Pure White Light Reflection Sweep -->
  <g clip-path="url(#faceClip_gmail)">
    <rect class="coin-sheen_gmail" x="-32" y="-32" width="128" height="128" fill="url(#sheen_gmail)" />
  </g>

  <!-- Top Rim Specular Glint -->
  <path d="M 14 18 A 24 24 0 0 1 50 18" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45" />
</svg>