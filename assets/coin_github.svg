<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56">
  <defs>
    <!-- Heavy Gunmetal / Matte Slate Beveled Rim -->
    <linearGradient id="tacticalRim_github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="75%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Combat Face Radial (Deep Enamel) -->
    <radialGradient id="combatFace_github" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="65%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#080C14" />
    </radialGradient>

    <!-- Crisp Pure White Specular Sheen Reflection (Zero Blue Slop) -->
    <linearGradient id="sheen_github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="depth_github" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <clipPath id="faceClip_github">
      <circle cx="32" cy="32" r="23" />
    </clipPath>
  </defs>

  <style>
    @keyframes sheenSweep_github {
      0% { transform: translateX(-64px) translateY(-64px); }
      30%, 100% { transform: translateX(64px) translateY(64px); }
    }
    .coin-sheen_github {
      animation: sheenSweep_github 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      animation-delay: 2s;
    }
  </style>

  <!-- Ground Drop Shadow -->
  <circle cx="32" cy="34.5" r="27" fill="#000000" opacity="0.6" />

  <!-- Outer Gunmetal Bezel Rim -->
  <circle cx="32" cy="32" r="27" fill="url(#tacticalRim_github)" filter="url(#depth_github)" />

  <!-- Precision Machined Inner Borders -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#0B0F19" stroke-width="1.2" />
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- 4 Tactical Rivet Corner Bolts -->
  <circle cx="32" cy="6.5" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="57.5" cy="32" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="32" cy="57.5" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />
  <circle cx="6.5" cy="32" r="1.3" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.6" />

  <!-- Recessed Combat Face -->
  <circle cx="32" cy="32" r="23" fill="url(#combatFace_github)" />

  <!-- Embossed Official Brand Logo -->
  <g fill="#FFFFFF" opacity="0.95">
    <g transform="translate(20, 20)">
  <path d="M 12 0 C 5.4 0 0 5.4 0 12 C 0 17.3 3.4 21.8 8.2 23.4 C 8.8 23.5 9 23.1 9 22.8 C 9 22.5 9 21.5 9 20.3 C 5.6 21 4.9 18.7 4.9 18.7 C 4.4 17.4 3.6 17 3.6 17 C 2.6 16.2 3.7 16.3 3.7 16.3 C 4.9 16.3 5.5 17.5 5.5 17.5 C 6.6 19.3 8.4 18.7 9.1 18.4 C 9.2 17.6 9.5 17.1 9.9 16.8 C 7.2 16.5 4.4 15.4 4.4 10.7 C 4.4 9.4 4.9 8.3 5.7 7.5 C 5.6 7.2 5.1 5.9 5.9 4.3 C 5.9 4.3 6.9 4 9.1 5.6 C 10.1 5.3 11.1 5.2 12.1 5.2 C 13.1 5.2 14.1 5.3 15.1 5.6 C 17.3 4 18.3 4.3 18.3 4.3 C 19.1 5.9 18.6 7.2 18.5 7.5 C 19.3 8.3 19.8 9.4 19.8 10.7 C 19.8 15.4 17 16.5 14.3 16.8 C 14.7 17.2 15.1 18 15.1 19.1 C 15.1 20.7 15.1 22.1 15.1 22.5 C 15.1 22.9 15.4 23.3 16 23.1 C 20.8 21.6 24.2 17.2 24.2 12 C 24 5.4 18.6 0 12 0 Z" />
</g>
  </g>

  <!-- Animated Pure White Light Reflection Sweep -->
  <g clip-path="url(#faceClip_github)">
    <rect class="coin-sheen_github" x="-32" y="-32" width="128" height="128" fill="url(#sheen_github)" />
  </g>

  <!-- Top Rim Specular Glint -->
  <path d="M 14 18 A 24 24 0 0 1 50 18" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45" />
</svg>