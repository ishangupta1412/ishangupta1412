<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="310">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="60%" stop-color="#070C18" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Hairline Grid Pattern -->
    <pattern id="termGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes liveBeacon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(310px); opacity: 0; }
    }
    .cursor-blink {
      animation: termBlink 1.1s steps(2, start) infinite;
    }
    .status-beacon {
      animation: liveBeacon 2.2s ease-in-out infinite;
    }
    .scan-line {
      animation: scanBeam 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .font-mono {
      font-family: 'Fira Code', 'SF Mono', Menlo, Monaco, Consolas, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    }
  </style>

  <!-- Terminal Frame -->
  <rect width="920" height="310" rx="14" fill="url(#termBg)" stroke="#1E293B" stroke-width="1.2" />
  <rect width="920" height="310" rx="14" fill="url(#termGrid)" />

  <!-- Laser Scanline -->
  <line class="scan-line" x1="0" y1="0" x2="920" y2="0" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.6" filter="url(#neonGlow)" />

  <!-- Window Header Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 906 0 Q 920 0 920 14 L 920 38 L 0 38 Z" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2" />

  <!-- Window Controls (Red / Yellow / Green) -->
  <circle cx="24" cy="19" r="6" fill="#EF4444" opacity="0.85" />
  <circle cx="44" cy="19" r="6" fill="#F59E0B" opacity="0.85" />
  <circle cx="64" cy="19" r="6" fill="#10B981" opacity="0.85" />

  <!-- Window Title -->
  <text x="460" y="24" fill="#64748B" class="font-mono" font-size="11.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    ishan@node-01: ~/systems/runtime (zsh)
  </text>

  <!-- Live Status Node (Top Right) -->
  <circle class="status-beacon" cx="875" cy="19" r="4.5" fill="#10B981" filter="url(#neonGlow)" />
  <text x="862" y="23" fill="#10B981" class="font-mono" font-size="10.5" font-weight="600" text-anchor="end">SYS.READY</text>

  <!-- ================= LEFT COLUMN: CLI & Identity ================= -->
  <g transform="translate(36, 68)">
    <!-- Terminal Prompt Line -->
    <text x="0" y="0" fill="#38BDF8" class="font-mono" font-size="13" font-weight="600">
      ishan@node-01:~$ <tspan fill="#F8FAFC">whoami --verbose</tspan>
    </text>

    <!-- Developer Identity Headline -->
    <text x="0" y="38" fill="#F8FAFC" class="font-sans" font-size="30" font-weight="800" letter-spacing="-0.5">
      Ishan Gupta
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="66" fill="#94A3B8" class="font-sans" font-size="13.5" font-weight="400">
      Systems Builder &amp; Security Researcher • First-Year Engineer
    </text>

    <!-- Key Metadata Tags -->
    <g transform="translate(0, 92)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="11.5">INITIATIVES:</text>
      <text x="96" y="0" fill="#38BDF8" class="font-mono" font-size="11.5" font-weight="600">Microsoft Innovate '26 • SIH '26</text>

      <text x="0" y="22" fill="#64748B" class="font-mono" font-size="11.5">STACK.CORE:</text>
      <text x="96" y="22" fill="#F1F5F9" class="font-mono" font-size="11.5">TypeScript • Next.js 16 • React 19 • Python</text>

      <text x="0" y="44" fill="#64748B" class="font-mono" font-size="11.5">INTELLIGENCE:</text>
      <text x="96" y="44" fill="#34D399" class="font-mono" font-size="11.5">Gemini Multimodal Vision • pgvector RAG</text>

      <text x="0" y="66" fill="#64748B" class="font-mono" font-size="11.5">SECURITY:</text>
      <text x="96" y="66" fill="#F43F5E" class="font-mono" font-size="11.5">SOC Telemetry • Sentinel ARM • SHA-256</text>
    </g>

    <!-- Blinking Cursor Prompt -->
    <g transform="translate(0, 186)">
      <text x="0" y="0" fill="#38BDF8" class="font-mono" font-size="12">
        ishan@node-01:~$ <tspan class="cursor-blink" fill="#00F0FF">█</tspan>
      </text>
    </g>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="510" y1="52" x2="510" y2="290" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- ================= RIGHT COLUMN: System Telemetry Bento ================= -->
  <g transform="translate(534, 58)">
    <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1">
      ACTIVE SYSTEM TELEMETRY
    </text>

    <!-- Bento Card 1: Quorum -->
    <g transform="translate(0, 16)">
      <rect width="350" height="98" rx="8" fill="#080E1B" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="98" stroke="#38BDF8" stroke-width="3" />

      <text x="16" y="24" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">01. QUORUM // SOC DEFENSE</text>
      <rect x="250" y="11" width="86" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.8" />
      <text x="293" y="23.5" fill="#38BDF8" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">MS INNOVATE '26</text>

      <text x="16" y="48" fill="#94A3B8" class="font-sans" font-size="11.5">
        Mitigates NOBELIUM distributed password sprays.
      </text>
      <text x="16" y="66" fill="#64748B" class="font-mono" font-size="10">
        Union-Find Graph • Sentinel ARM • SHA-256 Ledger
      </text>

      <!-- URL link -->
      <text x="16" y="86" fill="#10B981" class="font-mono" font-size="9.5" font-weight="600">
        → https://quorum-soc.vercel.app
      </text>
    </g>

    <!-- Bento Card 2: BIS Saathi -->
    <g transform="translate(0, 126)">
      <rect width="350" height="98" rx="8" fill="#080E1B" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="98" stroke="#10B981" stroke-width="3" />

      <text x="16" y="24" fill="#10B981" class="font-mono" font-size="12" font-weight="700">02. BIS SAATHI // GOVTECH COCKPIT</text>
      <rect x="264" y="11" width="72" height="18" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="0.8" />
      <text x="300" y="23.5" fill="#10B981" class="font-mono" font-size="9" font-weight="700" text-anchor="middle">SIH 26107</text>

      <text x="16" y="48" fill="#94A3B8" class="font-sans" font-size="11.5">
        Multimodal compliance &amp; forensic standards verification.
      </text>
      <text x="16" y="66" fill="#64748B" class="font-mono" font-size="10">
        Gemini 3.8 Vision • pgvector RAG • GIGW 3.0 AA
      </text>

      <!-- URL link -->
      <text x="16" y="86" fill="#10B981" class="font-mono" font-size="9.5" font-weight="600">
        → https://bis-saathi-nine.vercel.app
      </text>
    </g>
  </g>
</svg>
